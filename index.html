<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>喵喵错题本 (大容量版)</title>
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-light: #fff0f5;
            --pink-main: #ffb6c1;
            --pink-dark: #ff69b4;
            --pink-text: #8b4752;
            --nav-height: 70px;
            --border-radius: 20px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'ZCOOL KuaiLe', sans-serif; }
        body { background-color: var(--pink-light); color: var(--pink-text); padding-bottom: var(--nav-height); position: relative; min-height: 100vh; overflow-x: hidden; }
        
        .page-container { display: none; padding: 20px; padding-bottom: 20px; animation: fadeIn 0.3s ease; }
        .page-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-height);
            background: #fff; border-top: 2px solid var(--pink-main);
            display: flex; justify-content: space-around; align-items: center;
            z-index: 100; box-shadow: 0 -2px 15px rgba(255, 182, 193, 0.3);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-size: 12px; color: #d1a9b4; cursor: pointer; transition: all 0.2s; width: 20%;
        }
        .nav-item span { display: block; }
        .nav-item .nav-icon { font-size: 28px; line-height: 1.2; margin-bottom: 3px; transition: 0.2s; }
        .nav-item.active { color: var(--pink-dark); font-weight: bold; }
        .nav-item.active .nav-icon { transform: scale(1.1); }

        .card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(5px); border-radius: var(--border-radius); padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(255, 182, 193, 0.2); border: 1px solid rgba(255, 182, 193, 0.3); }
        .btn-pink { background: var(--pink-main); color: #fff; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-size: 14px; box-shadow: 0 4px 6px rgba(255, 105, 180, 0.3); transition: 0.2s; }
        .btn-pink:active { transform: scale(0.95); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 200; align-items: center; justify-content: center; }
        .modal-content { background: #fff; width: 90%; max-width: 450px; border-radius: var(--border-radius); padding: 20px; position: relative; max-height: 85vh; overflow-y: auto; }
        .modal-content h3 { text-align: center; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select, .form-group textarea { padding: 8px; border-radius: 10px; border: 1px solid #ddd; font-size: 14px; }
        .image-preview-box { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .image-preview-box img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 1px solid #eee; }

        .image-viewer { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
        .image-viewer .back-btn { position: absolute; top: 20px; left: 20px; color: white; font-size: 24px; cursor: pointer; z-index: 1001; }
        .image-viewer .img-wrapper { width: 90%; height: 70%; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; user-select: none; -webkit-user-drag: none; }
        .image-viewer .img-wrapper img { max-width: 100%; max-height: 100%; cursor: zoom-in; transition: transform 0.2s; object-fit: contain; -webkit-user-drag: none; user-select: none; }
        .image-viewer .img-wrapper img.zoomed { transform: scale(2); cursor: zoom-out; }
        .image-viewer .swipe-btn { position: absolute; color: rgba(255,255,255,0.5); font-size: 30px; cursor: pointer; top: 45%; user-select: none; }
        .image-viewer .left-btn { left: 10px; }
        .image-viewer .right-btn { right: 10px; }
        .image-viewer .index-display { position: absolute; bottom: 30px; color: white; font-size: 16px; }

        .error-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #fce4ec; padding: 10px 0; }
        .error-item .info { flex: 1; }
        .error-item .info h4 { font-size: 16px; }
        .error-item .info span { font-size: 12px; color: #999; display: block; }
        .error-item .info.completed h4, .error-item .info.completed div, .error-item .info.completed span { text-decoration: line-through; color: #b0bec5 !important; }
        .error-item .actions button { background: transparent; border: none; font-size: 18px; cursor: pointer; margin-left: 5px; }
        .error-item .actions .done-btn { color: #4caf50; }
        .error-item .actions .edit-btn { color: #2196f3; }
        .error-item .actions .delete-btn { color: #f44336; }

        .filter-select { margin-bottom: 10px; width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #ddd; }
        .option-btn { margin: 5px; padding: 5px 10px; border-radius: 15px; background: #fce4ec; border: none; cursor: pointer; font-size: 12px; }
        .option-btn.active { background: var(--pink-main); color: white; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .calendar-grid .day { background: #fff; padding: 10px 0; border-radius: 10px; cursor: pointer; font-size: 14px; position: relative; transition: all 0.2s ease; }
        .calendar-grid .day.has-errors::after { content: '🐟'; display: block; font-size: 12px; line-height: 1; margin-top: 2px; }
        .calendar-grid .day.has-errors { background: #fff5f8; }
        .calendar-grid .day.disabled { color: #ddd; }
        .calendar-grid .day.selected { transform: scale(1.15); border: 3px solid var(--pink-dark); background: #fff; z-index: 10; box-shadow: 0 2px 12px rgba(255, 105, 180, 0.4); color: var(--pink-dark); font-weight: bold; }

        .data-actions { display: flex; gap: 10px; margin-top: 10px; }
        #import-textarea { width: 100%; height: 100px; margin-top: 10px; padding: 8px; border-radius: 10px; border: 1px solid #ddd; }
        .review-controls { display: flex; gap: 10px; margin: 10px 0; }
    </style>
</head>
<body>
<div class="bottom-nav" id="bottomNav">
    <div class="nav-item active" onclick="switchTab('tab-home')"><span class="nav-icon">🐱</span><span>喵主页</span></div>
    <div class="nav-item" onclick="switchTab('tab-review')"><span class="nav-icon">⏰</span><span>今日复习</span></div>
    <div class="nav-item" onclick="switchTab('tab-errors')"><span class="nav-icon">📖</span><span>全部错题</span></div>
    <div class="nav-item" onclick="switchTab('tab-calendar')"><span class="nav-icon">📅</span><span>喵日历</span></div>
    <div class="nav-item" onclick="switchTab('tab-trash')"><span class="nav-icon">🗑️</span><span>垃圾桶</span></div>
</div>

<div id="app-container">
    <div id="tab-home" class="page-container active">
        <div class="card"><h2>📚 喵喵错题本</h2><p style="font-size: 14px; color: #888; margin: 10px 0;">根据艾宾浩斯记忆曲线，今天共 <span id="today-count" style="color:var(--pink-dark); font-weight:bold;">0</span> 道题需要复习。</p><button class="btn-pink" onclick="openModal()" style="width: 100%; padding: 12px;">➕ 添加新错题</button></div>
        <div class="card"><h3>📍 快速分类</h3><div style="display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px;"><button class="option-btn" onclick="addErrorByCategory('高等数学')">高数</button><button class="option-btn" onclick="addErrorByCategory('线性代数')">线代</button><button class="option-btn" onclick="addErrorByCategory('概率论与数理统计')">概率论</button></div></div>
        <div class="card"><h3>💾 数据存储</h3><div class="data-actions"><button class="btn-pink" onclick="exportData()">📤 导出数据</button><button class="btn-pink" onclick="document.getElementById('import-area').style.display='block'">📥 导入数据</button></div><div id="import-area" style="display:none; margin-top:10px;"><textarea id="import-textarea" placeholder="粘贴复制好的代码数据..."></textarea><button class="btn-pink" onclick="importData()" style="margin-top:5px; width:100%;">点击确认导入</button></div></div>
    </div>
    <div id="tab-review" class="page-container">
        <div class="card"><h2>⏰ 今日复习 <span style="font-size:14px; font-weight:normal;">(艾宾浩斯曲线提醒)</span></h2><div class="review-controls"><button class="btn-pink" onclick="shuffleReview()">🔀 乱序复习</button><button class="btn-pink" onclick="resetReviewOrder()">🔄 恢复日期顺序</button><button class="btn-pink" onclick="loadReview()">🔄 刷新列表</button></div><div id="review-list"></div></div>
    </div>
    <div id="tab-errors" class="page-container">
        <div class="card"><h2>📄 全部错题</h2><div style="margin-bottom:10px;"><select id="error-filter-cat" class="filter-select" onchange="loadErrors()"><option value="all">全部知识点</option><option value="高等数学">📐 高等数学</option><option value="线性代数">🧮 线性代数</option><option value="概率论与数理统计">🎲 概率论与数理统计</option></select><select id="error-filter-workbook" class="filter-select" onchange="loadErrors()"><option value="all">全部练习册</option></select></div><div id="error-list"></div></div>
    </div>
    <div id="tab-calendar" class="page-container">
        <div class="card"><h2>📅 喵日历</h2><div id="calendar-header" style="display:flex; justify-content:space-between; padding:10px 0;"><button onclick="changeMonth(-1)">〈</button><span id="month-label">2026年 7月</span><button onclick="changeMonth(1)">〉</button></div><div id="calendar-grid" class="calendar-grid"></div><div id="calendar-errors" style="margin-top:15px;"></div></div>
    </div>
    <div id="tab-trash" class="page-container">
        <div class="card"><div style="display:flex; justify-content:space-between;"><h2>🗑️ 回收站</h2><button class="btn-pink" onclick="clearTrash()">清空垃圾桶</button></div><div id="trash-list"></div></div>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-content"><h3 id="modal-title">🐾 添加新错题</h3><input type="hidden" id="edit-id">
        <div class="form-group"><label>题号</label><input type="text" id="subject-id" placeholder="例：2023年真题第一题" /></div>
        <div class="form-group"><label>考研数学分类</label><select id="knowledge-point" onchange="updateErrorTypes()"><option value="高等数学">高等数学</option><option value="线性代数">线性代数</option><option value="概率论与数理统计">概率论与数理统计</option></select></div>
        <div class="form-group"><label>错题类型 (具体考点)</label><select id="error-type"><option value="未分类">请先选择上方大分类</option></select></div>
        <div class="form-group"><label>练习册名称</label><input type="text" id="workbook-name" placeholder="例：660题、李林880" /></div>
        <div class="form-group"><label>页码</label><input type="text" id="page-number" placeholder="例：P65 或 65页" /></div>
        <div class="form-group"><label>错题图片 (最多可选9张)</label><input type="file" id="image-upload" multiple accept="image/*" onchange="previewImages(this, 'image-previews', 'currentImages')" /><div class="image-preview-box" id="image-previews"></div></div>
        <div class="form-group"><label>错题题目 (选填)</label><textarea id="question-text" rows="2" placeholder="输入题目内容或关键描述..."></textarea></div>
        <div class="form-group"><label>答案图片 (最多可选9张)</label><input type="file" id="answer-image-upload" multiple accept="image/*" onchange="previewImages(this, 'answer-image-previews', 'currentAnswerImages')" /><div class="image-preview-box" id="answer-image-previews"></div></div>
        <div class="form-group"><label>题目答案 (选填)</label><textarea id="answer-text" rows="3" placeholder="输入详细的解题步骤..."></textarea></div>
        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;"><button class="btn-pink" onclick="closeModal()">取消</button><button class="btn-pink" style="background:var(--pink-dark);" onclick="saveError()">保存错题</button></div>
    </div>
</div>

<div class="image-viewer" id="imageViewer">
    <div class="back-btn" onclick="closeImageViewer()">✕ 返回</div>
    <div class="swipe-btn left-btn" onclick="changeImage(-1)">‹</div>
    <div class="img-wrapper" id="imgWrapper"><img id="viewerImg" src="" onclick="toggleZoom()" /></div>
    <div class="swipe-btn right-btn" onclick="changeImage(1)">›</div>
    <div class="index-display" id="imgIndex"></div>
</div>

<script>
    // ================= 核心升级：IndexedDB 大容量存储层 =================
    const DB_NAME = 'CatErrorDB_v2';
    const STORE_NAME = 'errors_data';
    
    function openDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, 1);
            request.onupgradeneeded = e => {
                const db = e.target.result;
                if (!db.objectStoreNames.contains(STORE_NAME)) {
                    db.createObjectStore(STORE_NAME, { keyPath: 'key' });
                }
            };
            request.onsuccess = e => resolve(e.target.result);
            request.onerror = e => reject(e.target.error);
        });
    }

    async function getData() {
        try {
            const db = await openDB();
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.get('main_data');
            return new Promise((resolve, reject) => {
                request.onsuccess = e => {
                    const result = e.target.result;
                    if (result) {
                        resolve(result.data);
                    } else {
                        // 平滑迁移 localStorage 旧数据到 IndexedDB
                        const raw = localStorage.getItem('cat_error_book');
                        if (raw) {
                            try {
                                const oldData = JSON.parse(raw);
                                saveData(oldData).then(() => {
                                    localStorage.removeItem('cat_error_book'); // 迁移后自动删掉旧的小缓存
                                    resolve(oldData);
                                });
                            } catch (e) { resolve({ errors: [], trash: [] }); }
                        } else {
                            resolve({ errors: [], trash: [] });
                        }
                    }
                };
                request.onerror = e => reject(e.target.error);
            });
        } catch (e) {
            console.error("IndexedDB 读取失败，尝试降级到 localStorage", e);
            const raw = localStorage.getItem('cat_error_book');
            return raw ? JSON.parse(raw) : { errors: [], trash: [] };
        }
    }

    async function saveData(data) {
        try {
            const db = await openDB();
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.put({ key: 'main_data', data: data });
            return new Promise((resolve, reject) => {
                request.onsuccess = () => resolve();
                request.onerror = e => reject(e.target.error);
            });
        } catch (e) {
            throw e;
        }
    }

    const knowledgeTypeMap = {
        '高等数学': ['函数极限与连续', '导数与微分', '微分中值定理', '不定积分与定积分', '定积分的应用', '多元函数微分学', '重积分', '曲线曲面积分', '无穷级数', '微分方程'],
        '线性代数': ['行列式', '矩阵运算', '向量与线性相关性', '线性方程组解的结构', '特征值与特征向量', '二次型'],
        '概率论与数理统计': ['随机事件与概率', '一维随机变量分布', '多维随机变量分布', '数字特征', '大数定律与中心极限定理', '数理统计与参数估计']
    };

    let currentImages = []; 
    let currentAnswerImages = []; 
    let viewerImages = []; 
    let viewerIndex = 0;

    function updateErrorTypes() {
        const mainCat = document.getElementById('knowledge-point').value;
        const errorTypeSelect = document.getElementById('error-type');
        const types = knowledgeTypeMap[mainCat] || [];
        errorTypeSelect.innerHTML = '';
        if(types.length === 0) {
            errorTypeSelect.innerHTML = '<option value="未分类">该分类暂无细分考点</option>';
        } else {
            types.forEach(type => {
                const option = document.createElement('option');
                option.value = type; option.innerText = type;
                errorTypeSelect.appendChild(option);
            });
        }
    }

    // 图片压缩逻辑 (保留之前的高效压缩)
    function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.onerror = reject;
                img.src = e.target.result;
            };
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function previewImages(input, previewId, targetArrName) {
        const files = input.files;
        if (!files.length) return;
        const previewContainer = document.getElementById(previewId);
        const targetArr = targetArrName === 'currentImages' ? currentImages : currentAnswerImages;
        let limitedFiles = Array.from(files);
        if (limitedFiles.length > 9) { alert("⚠️ 图片最多只能上传 9 张，系统将自动截取前 9 张。"); limitedFiles = limitedFiles.slice(0, 9); }
        targetArr.splice(0, targetArr.length);
        previewContainer.innerHTML = '<div style="font-size:12px; color:#888; padding:10px;">⏳ 正在压缩图片，请稍候...</div>';
        try {
            const compressedResults = await Promise.all(limitedFiles.map(file => compressImage(file)));
            targetArr.push(...compressedResults);
            previewContainer.innerHTML = targetArr.map(img => `<img src="${img}" />`).join('');
        } catch (error) {
            alert("图片压缩失败，请重新选择图片。" + error.message);
        }
    }

    async function saveError() {
        try {
            const id = document.getElementById('edit-id').value;
            const subjectId = document.getElementById('subject-id').value.trim();
            const questionText = document.getElementById('question-text').value.trim();
            const knowledgePoint = document.getElementById('knowledge-point').value;
            const errorType = document.getElementById('error-type').value;
            const workbook = document.getElementById('workbook-name').value.trim();
            const page = document.getElementById('page-number').value.trim();
            const answerText = document.getElementById('answer-text').value.trim();
            const date = new Date().toISOString().split('T')[0];
            const images = currentImages; 
            const answerImages = currentAnswerImages;

            if (!subjectId && !questionText && images.length === 0) {
                alert("⚠️ 保存失败！\n请至少填写「题号」、「错题题目」或上传一张「错题图片」中的一项！");
                return;
            }

            const data = await getData();
            let errorObj = {
                id: id || Date.now().toString(36) + Math.random().toString(36),
                subjectId, questionText, knowledgePoint, errorType, workbook, page, 
                answerText, images, answerImages,
                dateAdded: date, lastReviewDate: date, isDone: false, inTrash: false, reviewCount: 0
            };

            if (id) {
                const index = data.errors.findIndex(item => item.id === id);
                if (index !== -1) {
                    if(errorObj.images.length === 0) errorObj.images = data.errors[index].images;
                    if(errorObj.answerImages.length === 0) errorObj.answerImages = data.errors[index].answerImages || [];
                    data.errors[index] = { ...data.errors[index], ...errorObj };
                }
            } else {
                data.errors.push(errorObj);
            }

            await saveData(data);
            closeModal();
            await refreshAllTabs();
            alert("✅ 喵~ 错题保存成功！");
        } catch (e) {
            // 捕获 IndexedDB 错误
            if (e.name === 'QuotaExceededError' || e.message.includes('exceeded the quota')) {
                alert("❌ 保存失败！\n\n您的手机/电脑磁盘空间可能即将写满，或者 IndexedDB 遇到存储上限。\n\n✅ 建议您：\n1. 去【全部错题】删掉做完了（带✅）的错题。\n2. 去【垃圾桶】清空回收站。\n3. 如果依然不够，请点击【导出数据】保存代码，然后在浏览器设置里清理该网站的缓存数据，再重新导入。");
            } else {
                alert("❌ 保存失败，发生了代码错误！\n错误原因: " + e.message);
            }
        }
    }

    async function deleteError(id) {
        const data = await getData();
        const index = data.errors.findIndex(item => item.id === id);
        if (index !== -1) {
            data.trash.push(data.errors[index]);
            data.errors.splice(index, 1);
            await saveData(data); refreshAllTabs();
        }
    }

    async function restoreFromTrash(id) {
        const data = await getData();
        const index = data.trash.findIndex(item => item.id === id);
        if (index !== -1) {
            data.errors.push(data.trash[index]);
            data.trash.splice(index, 1);
            await saveData(data); refreshAllTabs();
        }
    }

    async function clearTrash() {
        if(confirm("确定要永久清空回收站吗？此操作不可撤销！")) {
            const data = await getData(); data.trash = [];
            await saveData(data); refreshAllTabs();
        }
    }

    async function markAsDone(id) {
        const data = await getData();
        const index = data.errors.findIndex(item => item.id === id);
        if (index !== -1) {
            data.errors[index].isDone = !data.errors[index].isDone;
            await saveData(data); refreshAllTabs();
        }
    }

    async function editError(id) {
        const data = await getData();
        const item = data.errors.find(item => item.id === id);
        if (!item) return;
        
        document.getElementById('edit-id').value = item.id;
        document.getElementById('subject-id').value = item.subjectId;
        document.getElementById('question-text').value = item.questionText || '';
        document.getElementById('knowledge-point').value = item.knowledgePoint;
        updateErrorTypes(); 
        document.getElementById('error-type').value = item.errorType || '未分类';
        document.getElementById('workbook-name').value = item.workbook || '';
        document.getElementById('page-number').value = item.page || '';
        document.getElementById('answer-text').value = item.answerText;
        currentImages = [...(item.images || [])];
        currentAnswerImages = [...(item.answerImages || [])];
        document.getElementById('image-previews').innerHTML = currentImages.map(img => `<img src="${img}" />`).join('');
        document.getElementById('answer-image-previews').innerHTML = currentAnswerImages.map(img => `<img src="${img}" />`).join('');
        document.getElementById('modal-title').innerText = '✏️ 编辑错题';
        document.getElementById('addModal').style.display = 'flex';
    }

    // ================= 重点修复：手机端点开图片 =================
    function openImageViewer(images, index = 0) {
        try {
            // 1. 如果在手机上第一次点开没反应，下面这个弹窗会告诉您到底发生了什么
            if (!images || images.length === 0) {
                alert("这张错题底下似乎没有有效的图片文件。您可以点击编辑，重新上传一次图片。");
                return;
            }
            viewerImages = images;
            viewerIndex = index % images.length;
            const img = document.getElementById('viewerImg');
            const indexDisplay = document.getElementById('imgIndex');

            // 2. 加载图片前，先显示加载中状态，防止手机端卡住
            img.src = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2MCIgaGVpZ2h0PSI2MCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBkPSJNMTIgMkM2LjQ4IDIgMiA2LjQ4IDIgMTJzNC40OCAxMCAxMCAxMCAxMC00LjQ4IDEwLTEwUzE3LjUyIDIgMTIgMnptMCAxOGMtNC40MSAwLTgtMy41OS04LThzMy41OS04IDgtOCA4IDMuNTkgOCA4LTMuNTkgOC04IDh6IiBmaWxsPSIjRkZGIiBvcGFjaXR5PSIwLjMiLz48L3N2Zz4='; // 过渡占位
            img.className = '';
            img.style.transform = "scale(1)";
            
            // 延时一瞬渲染真实图片
            setTimeout(() => {
                img.src = images[viewerIndex];
                if(indexDisplay) indexDisplay.innerText = `${viewerIndex + 1} / ${images.length}`;
            }, 50);

            document.getElementById('imageViewer').style.display = 'flex';

            // 3. 如果图片损坏，单独告诉用户是哪张图坏了
            img.onerror = function() {
                alert(`⚠️ 第 ${viewerIndex + 1} 张图片数据损坏。建议您在手机上长按该错题，点击「编辑」，然后重新上传图片。`);
            };
        } catch (error) {
            alert("打开图片发生了未知错误，可能是图片数据太大导致手机内存不足。您可以尝试刷新页面。\n错误信息: " + error.message);
        }
    }

    function closeImageViewer() { document.getElementById('imageViewer').style.display = 'none'; }
    function changeImage(delta) {
        viewerIndex = (viewerIndex + delta + viewerImages.length) % viewerImages.length;
        const img = document.getElementById('viewerImg');
        img.src = viewerImages[viewerIndex];
        img.className = ''; img.style.transform = "scale(1)";
        document.getElementById('imgIndex').innerText = `${viewerIndex + 1} / ${viewerImages.length}`;
        img.onerror = function() {
            alert(`⚠️ 第 ${viewerIndex + 1} 张图片数据损坏。建议重新编辑上传。`);
        };
    }
    function toggleZoom() { document.getElementById('viewerImg').classList.toggle('zoomed'); }

    document.addEventListener('DOMContentLoaded', () => {
        const imgWrapper = document.getElementById('imgWrapper');
        if (imgWrapper) {
            imgWrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const img = document.getElementById('viewerImg');
                if (e.deltaY < 0) { img.style.transform = "scale(2)"; img.style.cursor = "zoom-out"; } 
                else { img.style.transform = "scale(1)"; img.style.cursor = "zoom-in"; }
            }, { passive: false });
        }
        const viewerEl = document.getElementById('imageViewer');
        let touchStartX = 0;
        if(viewerEl) {
            viewerEl.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
            viewerEl.addEventListener('touchend', e => {
                const touchEndX = e.changedTouches[0].screenX;
                if (touchStartX - touchEndX > 50) changeImage(1); 
                if (touchEndX - touchStartX > 50) changeImage(-1);
            }, { passive: true });
        }
    });

    function switchTab(tabId) {
        document.querySelectorAll('.page-container').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`[onclick="switchTab('${tabId}')"]`).classList.add('active');
        refreshAllTabs();
    }

    async function refreshAllTabs() {
        await loadErrors(); await loadReview(); await renderCalendar(); await loadTrash(); await updateHomeStats();
    }

    async function updateHomeStats() {
        const data = await getData();
        const today = new Date().toISOString().split('T')[0];
        const due = data.errors.filter(e => !e.isDone && e.lastReviewDate <= today).length;
        document.getElementById('today-count').innerText = due;
    }

    async function updateWorkbookFilter() {
        const data = await getData();
        const wbSelect = document.getElementById('error-filter-workbook');
        if (!wbSelect) return;
        const currentVal = wbSelect.value;
        const workbooks = [...new Set(data.errors.map(e => e.workbook).filter(Boolean))];
        wbSelect.innerHTML = '<option value="all">全部练习册</option>';
        workbooks.forEach(wb => {
            const option = document.createElement('option');
            option.value = wb; option.innerText = wb;
            wbSelect.appendChild(option);
        });
        wbSelect.value = currentVal;
    }

    async function loadErrors() {
        const data = await getData();
        const catFilter = document.getElementById('error-filter-cat').value;
        const wbFilter = document.getElementById('error-filter-workbook').value;
        let list = data.errors;
        if (catFilter !== 'all') list = list.filter(e => e.knowledgePoint === catFilter);
        if (wbFilter !== 'all') list = list.filter(e => e.workbook === wbFilter);
        list.sort((a, b) => new Date(b.dateAdded) - new Date(a.dateAdded));
        const container = document.getElementById('error-list');

        if(list.length === 0) { container.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">🎉 筛选结果没有错题！</div>`; return; }
        await updateWorkbookFilter();

        // ================= 重点修复：使用 dataset 传递图片数组，防止手机 JS 找不到变量 =================
        container.innerHTML = list.map((item, idx) => `
            <div class="card ${item.isDone ? 'completed' : ''}" style="padding:10px; margin-bottom:10px;">
                <div class="error-item">
                    <div class="info">
                        <h4>#${idx+1} ${item.subjectId || '未填题号'}</h4>
                        ${item.questionText ? `<div style="font-size:14px; color:#333; margin:5px 0; background:#f8f9fa; padding:5px; border-radius:5px;">📝 ${item.questionText}</div>` : ''}
                        <span>📅 ${item.dateAdded}  |  📂 ${item.knowledgePoint}</span>
                        <span style="font-size:12px; color:#e91e63; display:block;">📌 错题类型: ${item.errorType || '未分类'}</span>
                        <span style="font-size:12px; color:#777; display:block;">📘 ${item.workbook || '无练习册'} ${item.page ? '| 📄 '+item.page : ''}</span>
                        <div style="margin-top:5px; display:flex; gap:5px; flex-wrap:wrap;">
                            ${(item.images || []).map((img, i) => {
                                // 使用 JSON.stringify 将数组安全传递进 data 属性
                                const imagesJson = JSON.stringify(item.images);
                                return `<img src="${img}" style="width:50px; height:50px; object-fit:cover; border-radius:5px; cursor:pointer; touch-action:manipulation;" data-images='${imagesJson}' data-index="${i}" onclick="openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" />`;
                            }).join('')}
                        </div>
                        <div class="answer-section" style="margin-top:5px; background:#f9f9f9; padding:8px; border-radius:5px;">
                            <div class="answer-toggle" style="color:#888; font-size:12px; cursor:pointer;" onclick="this.style.display='none'; this.nextElementSibling.style.display='block';">点击查看答案 👇</div>
                            <div class="answer-content" style="display:none; cursor:pointer;" onclick="this.style.display='none'; this.previousElementSibling.style.display='block';">
                                <div style="margin-bottom:5px; white-space:pre-wrap;">${item.answerText || '暂无文字答案'}</div>
                                ${(item.answerImages || []).map((img, i) => `<img src="${img}" style="max-width:100%; height:auto; border-radius:5px; margin-top:5px; cursor:pointer;" onclick="event.stopPropagation(); openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" data-images='${JSON.stringify(item.answerImages)}' data-index="${i}" />`).join('')}
                                <div style="font-size:12px; color:#999; margin-top:5px; text-align:center;">点击此处收起答案</div>
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="done-btn" onclick="markAsDone('${item.id}')">${item.isDone ? '✅' : '⬜'}</button>
                        <button class="edit-btn" onclick="editError('${item.id}')">✏️</button>
                        <button class="delete-btn" onclick="deleteError('${item.id}')">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    function getReviewList() {
        return getData().then(data => {
            const today = new Date().toISOString().split('T')[0];
            return data.errors.filter(e => !e.isDone && e.lastReviewDate <= today);
        });
    }

    async function loadReview() {
        let list = await getReviewList();
        const container = document.getElementById('review-list');
        if(list.length === 0) { container.innerHTML = `<div style="text-align:center; padding:30px; color:#999;">🎉 今天所有的错题都复习完啦！明天再来吧。</div>`; return; }
        container.innerHTML = list.map(item => `
            <div class="card" style="position:relative;">
                <h4>${item.subjectId || '错题'} <span style="font-size:12px; color:#888;">${item.knowledgePoint}</span></h4>
                ${item.questionText ? `<div style="font-size:14px; color:#333; margin:5px 0; background:#f8f9fa; padding:5px; border-radius:5px;">📝 ${item.questionText}</div>` : ''}
                <div style="font-size:12px; color:#e91e63; display:block; margin-bottom:5px;">📌 类型: ${item.errorType || '未分类'}</div>
                <div style="font-size:12px; color:#777; margin-bottom:5px;">📘 ${item.workbook || '无练习册'} ${item.page ? '📄 '+item.page : ''}</div>
                <div style="display:flex; gap:5px; flex-wrap:wrap; margin:5px 0;">
                    ${(item.images || []).map((img, i) => {
                        const imagesJson = JSON.stringify(item.images);
                        return `<img src="${img}" style="width:60px; height:60px; object-fit:cover; border-radius:5px; cursor:pointer; touch-action:manipulation;" data-images='${imagesJson}' data-index="${i}" onclick="openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" />`;
                    }).join('')}
                </div>
                <div class="answer-section" style="margin:10px 0; background:#fce4ec; padding:8px; border-radius:5px;">
                    <div class="ans-toggle" style="color:#888; font-size:12px; cursor:pointer;" onclick="this.style.display='none'; this.nextElementSibling.style.display='block';">点击显示答案</div>
                    <div class="ans-content" style="display:none; cursor:pointer;" onclick="this.style.display='none'; this.previousElementSibling.style.display='block';">
                        <div style="white-space:pre-wrap; margin-bottom:5px;">${item.answerText || '暂无文字解析'}</div>
                        ${(item.answerImages || []).map((img, i) => `<img src="${img}" style="max-width:100%; height:auto; border-radius:5px; margin-top:5px; cursor:pointer;" onclick="event.stopPropagation(); openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" data-images='${JSON.stringify(item.answerImages)}' data-index="${i}" />`).join('')}
                        <div style="font-size:12px; color:#999; margin-top:5px; text-align:center;">点击此处收起答案</div>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-pink" onclick="markAsDone('${item.id}'); loadReview();">✏️ 做完了/划掉</button>
                    <button class="btn-pink" style="background:#999;" onclick="deleteError('${item.id}'); loadReview();">🗑️ 删除</button>
                </div>
            </div>
        `).join('');
    }

    let reviewListCache = [];
    async function shuffleReview() {
        const list = await getReviewList();
        if(list.length === 0) return alert('暂无错题需要复习');
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        reviewListCache = list;
        renderReviewList(list);
    }

    function resetReviewOrder() { loadReview(); reviewListCache = []; }

    function renderReviewList(list) {
        const container = document.getElementById('review-list');
        container.innerHTML = list.map(item => `
            <div class="card" style="position:relative;">
                <h4>${item.subjectId || '错题'} <span style="font-size:12px; color:#888;">${item.knowledgePoint}</span></h4>
                ${item.questionText ? `<div style="font-size:14px; color:#333; margin:5px 0; background:#f8f9fa; padding:5px; border-radius:5px;">📝 ${item.questionText}</div>` : ''}
                <div style="font-size:12px; color:#e91e63; display:block; margin-bottom:5px;">📌 类型: ${item.errorType || '未分类'}</div>
                <div style="font-size:12px; color:#777; margin-bottom:5px;">📘 ${item.workbook || '无练习册'} ${item.page ? '📄 '+item.page : ''}</div>
                <div style="display:flex; gap:5px; flex-wrap:wrap; margin:5px 0;">
                    ${(item.images || []).map((img, i) => {
                        const imagesJson = JSON.stringify(item.images);
                        return `<img src="${img}" style="width:60px; height:60px; object-fit:cover; border-radius:5px; cursor:pointer; touch-action:manipulation;" data-images='${imagesJson}' data-index="${i}" onclick="openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" />`;

                <div class="answer-section" style="margin:10px 0; background:#fce4ec; padding:8px; border-radius:5px;">
                    <div class="ans-toggle" style="color:#888; font-size:12px; cursor:pointer;" onclick="this.style.display='none'; this.nextElementSibling.style.display='block';">点击显示答案</div>
                    <div class="ans-content" style="display:none; cursor:pointer;" onclick="this.style.display='none'; this.previousElementSibling.style.display='block';">
                        <div style="white-space:pre-wrap; margin-bottom:5px;">${item.answerText || '暂无文字解析'}</div>
                        ${(item.answerImages || []).map((img, i) => `<img src="${img}" style="max-width:100%; height:auto; border-radius:5px; margin-top:5px; cursor:pointer;" onclick="event.stopPropagation(); openImageViewer(JSON.parse(this.dataset.images), parseInt(this.dataset.index))" data-images='${JSON.stringify(item.answerImages)}' data-index="${i}" />`).join('')}
                        <div style="font-size:12px; color:#999; margin-top:5px; text-align:center;">点击此处收起答案</div>
                    </div>
                </div>
                <div style="display:flex; gap:10px;">
                    <button class="btn-pink" onclick="markAsDone('${item.id}'); loadReview();">✏️ 做完了/划掉</button>
                    <button class="btn-pink" style="background:#999;" onclick="deleteError('${item.id}'); loadReview();">🗑️ 删除</button>
                </div>
            </div>
        `).join('');
    }

    let currentDate = new Date(); let selectedDateStr = ''; 
    async function renderCalendar() {
        const data = await getData();
        const year = currentDate.getFullYear(); const month = currentDate.getMonth();
        document.getElementById('month-label').innerText = `${year}年 ${month+1}月`;
        const firstDay = new Date(year, month, 1).getDay(); const daysInMonth = new Date(year, month + 1, 0).getDate();
        const grid = document.getElementById('calendar-grid');
        let html = '<div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div>';
        for(let i=0; i<firstDay; i++) html += `<div class="day disabled"></div>`;
        for(let d=1; d<=daysInMonth; d++) {
            const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const hasErrors = data.errors.some(e => e.dateAdded === dateStr);
            const isSelected = (dateStr === selectedDateStr);
            html += `<div class="day ${hasErrors ? 'has-errors' : ''} ${isSelected ? 'selected' : ''}" onclick="selectDay(this, '${dateStr}')">${d}</div>`;
        }
        grid.innerHTML = html;
        if(selectedDateStr) showErrorsForDate(selectedDateStr);
    }

    function changeMonth(delta) { currentDate.setMonth(currentDate.getMonth() + delta); selectedDateStr = ''; renderCalendar(); }
    function selectDay(element, dateStr) {
        document.querySelectorAll('.calendar-grid .day').forEach(el => el.classList.remove('selected'));
        if(element) element.classList.add('selected');
        selectedDateStr = dateStr; showErrorsForDate(dateStr);
    }

    async function showErrorsForDate(date) {
        const data = await getData();
        const list = data.errors.filter(e => e.dateAdded === date);
        const container = document.getElementById('calendar-errors');
        if(list.length === 0) { container.innerHTML = `<p style="color:#999; text-align:center;">这一天没有错题记录哦 🐾</p>`; return; }
        container.innerHTML = list.map(item => `
            <div style="border:1px solid #eee; padding:8px; margin:5px 0; border-radius:10px; display:flex; justify-content:space-between; align-items:center;">
                <div><b>${item.subjectId || '无题号'}</b> - ${item.knowledgePoint} (${item.errorType || '未分类'})</div>
                <button onclick="editError('${item.id}')" style="background:none; border:none; color:var(--pink-dark); font-weight:bold;">编辑</button>
            </div>
        `).join('');
    }

    async function loadTrash() {
        const data = await getData();
        const container = document.getElementById('trash-list');
        if(data.trash.length === 0) { container.innerHTML = `<div style="text-align:center; padding:20px; color:#999;">🗑️ 垃圾桶是空的</div>`; return; }
        container.innerHTML = data.trash.map(item => `
            <div class="error-item"><div class="info"><h4>${item.subjectId || '已删除错题'}</h4><span>分类：${item.knowledgePoint} - ${item.errorType || '未分类'}</span></div><div><button class="btn-pink" onclick="restoreFromTrash('${item.id}')">恢复</button></div></div>
        `).join('');
    }

    async function exportData() {
        const data = await getData();
        const jsonStr = JSON.stringify(data);
        try {
            await navigator.clipboard.writeText(jsonStr);
            alert('数据已复制到剪贴板！\n请妥善保存这段代码。\n（若提示太长无法复制，请按Ctrl+C手动复制）');
        } catch (e) {
            alert('由于数据量过大，自动复制失败。请在下方选择全部文字并复制：\n' + jsonStr);
        }
    }

    async function importData() {
        const code = document.getElementById('import-textarea').value;
        if(!code) return alert('请先粘贴数据代码！');
        try {
            const data = JSON.parse(code);
            await saveData(data);
            document.getElementById('import-area').style.display = 'none';
            await refreshAllTabs();
            alert('数据导入成功！');
        } catch (e) {
            alert('导入失败：数据格式错误，请检查代码完整性。');
        }
    }

    function openModal() {
        document.getElementById('edit-id').value = '';
        document.getElementById('subject-id').value = ''; document.getElementById('question-text').value = '';
        document.getElementById('workbook-name').value = ''; document.getElementById('page-number').value = '';
        document.getElementById('answer-text').value = '';
        document.getElementById('image-previews').innerHTML = ''; document.getElementById('answer-image-previews').innerHTML = '';
        currentImages = []; currentAnswerImages = [];
        document.getElementById('modal-title').innerText = '🐾 添加新错题';
        document.getElementById('knowledge-point').value = '高等数学';
        updateErrorTypes();
        document.getElementById('addModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('addModal').style.display = 'none'; }
    function addErrorByCategory(cat) {
        document.getElementById('knowledge-point').value = cat;
        updateErrorTypes(); openModal();
    }

    window.onload = async () => {
        updateErrorTypes();
        await refreshAllTabs();
    }
</script>
